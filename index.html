<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Keyword Study Deck</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }
        h2, h3 { text-align: center; color: #fff; }
        
        .input-group {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00adb5;
        }
        textarea, input {
            width: 100%;
            background: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        textarea { height: 100px; resize: none; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #00adb5;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #008c95; }

        #display-box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            min-height: 80px;
            line-height: 2;
            font-size: 1.8rem;
            text-align: center;
            border: 1px solid #2d2d2d;
            margin-top: 10px;
        }

        /* The clickable colored keyword styling */
        .keyword-span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: background-color 0.2s;
        }
        .keyword-span:hover {
            background-color: #2d2d2d;
        }
        
        .normal-text {
            color: #e0e0e0;
        }
        .instructions {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Chinese Keyword Flash-Reader</h2>
        
        <div class="input-group">
            <label>1. Paste your 3 lines normal (No symbols needed):</label>
            <textarea id="lines-input" placeholder="Line 1: Chinese&#10;Line 2: Pinyin&#10;Line 3: English Translation"></textarea>
            
            <label>2. Type your 3 target keywords (separated by spaces):</label>
            <input type="text" id="keywords-input" placeholder="e.g., 爱美 算是 天性">
            
            <button onclick="buildSentence()">Generate Interactive View</button>
        </div>

        <h3>Interactive Study View</h3>
        <div id="display-box">Your sentence will load here...</div>
        <div class="instructions">Tap any colored, underlined word to cycle it!</div>
    </div>

    <script>
        // Three distinct neon colors mapped directly to your three words
        const keywordColors = ['#ff2e63', '#00ff75', '#fff600']; 

        function buildSentence() {
            const rawText = document.getElementById('lines-input').value;
            const lines = rawText.split('\n').filter(l => l.trim() !== "");
            
            const rawKeywords = document.getElementById('keywords-input').value.trim();
            if (lines.length < 3 || !rawKeywords) {
                alert("Please fill out both fields completely!");
                return;
            }

            const chineseWords = lines[0].split(/\s+/);
            const pinyinWords = lines[1].split(/\s+/);
            const englishWords = lines[2].split(/\s+/);
            const targetKeywords = rawKeywords.split(/\s+/);

            const displayBox = document.getElementById('display-box');
            displayBox.innerHTML = ""; // Reset view

            // Loop through the main Chinese sentence structure word by word
            for (let i = 0; i < chineseWords.length; i++) {
                const currentChinese = chineseWords[i];
                
                // Check if this specific word is one of your 3 chosen keywords
                const keywordIndex = targetKeywords.indexOf(currentChinese);

                if (keywordIndex !== -1) {
                    // It's a keyword! Create an interactive colored block
                    const span = document.createElement('span');
                    span.className = 'keyword-span';
                    
                    // Assign one of our 3 bright colors safely
                    span.style.color = keywordColors[keywordIndex % keywordColors.length];
                    span.textContent = currentChinese;

                    // Save the three states on the element
                    const states = [
                        currentChinese,                           // 0: Chinese
                        pinyinWords[i] || currentChinese,          // 1: Pinyin
                        englishWords[i] || currentChinese         // 2: Translation
                    ];
                    let currentState = 0;

                    span.onclick = () => {
                        currentState = (currentState + 1) % 3;
                        span.textContent = states[currentState];
                    };

                    displayBox.appendChild(span);
                } else {
                    // It's a normal word, just print it out in standard text color
                    const span = document.createElement('span');
                    span.className = 'normal-text';
                    span.textContent = currentChinese;
                    displayBox.appendChild(span);
                }

                // Add spaces between words so the sentence reads naturally
                displayBox.appendChild(document.createTextNode(" "));
            }
        }
    </script>
</body>
</html>
