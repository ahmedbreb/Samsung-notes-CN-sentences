<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chinese Pattern Study App</title>
    <style>
        /* Modern Dark Mode Styling */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; }

        /* Pages */
        .page { display: none; }
        .page.active { display: block; }

        /* Input Screen Layout */
        textarea {
            width: 100%;
            height: 200px;
            background: #1e1e1e;
            color: #fff;
            border: 2px dashed #444;
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            resize: none;
            font-family: monospace;
        }
        textarea:focus {
            border-color: #00adb5;
            outline: none;
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background-color: #00adb5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #008c95; }

        button.back-btn {
            background-color: #333;
            border: 1px solid #444;
            margin-top: 0;
            margin-bottom: 20px;
            width: auto;
            padding: 8px 16px;
            font-size: 0.95rem;
        }
        button.back-btn:hover { background-color: #444; }

        /* Interactive Display Box */
        #display-box {
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 12px;
            min-height: 100px;
            line-height: 2.6;
            font-size: 2rem;
            text-align: center;
            border: 1px solid #2d2d2d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Word Block Interactive Styling */
        .word-token {
            display: inline-block;
            cursor: pointer;
            padding: 2px 8px;
            margin: 4px;
            border-radius: 6px;
            user-select: none;
            font-weight: 500;
            transition: all 0.15s ease;
            border-bottom: 2px solid #444;
        }
        
        /* State Visual Effects */
        .state-chinese { color: #ffffff; border-bottom-color: #00adb5; }
        .state-pinyin { color: #00ff75; border-bottom-color: #00ff75; font-size: 1.6rem; }
        .state-english { color: #fff600; border-bottom-color: #fff600; font-size: 1.4rem; padding: 2px 12px; background: #252525; }

        .word-token:hover {
            background-color: #2a2a2a;
            transform: scale(1.05);
        }

        .hint {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER / NAVIGATION -->
        <div id="nav-bar" style="display: none; width: 100%; text-align: left;">
            <button class="back-btn" onclick="showInputPage()">⬅ Back to Input</button>
        </div>

        <!-- PAGE 1: INPUT PAGE -->
        <div id="input-page" class="page active">
            <h2>AI Chinese Study Tool</h2>
            <textarea id="ai-input" placeholder="Paste the structured text output directly from your AI chatbot here...&#10;&#10;Example format:&#10;爱美 | Ài měi | Loving beauty&#10;大概 | dàgài | probably"></textarea>
            <button onclick="parseAndLoadStudy()">Generate Flash-Sentence</button>
        </div>

        <!-- PAGE 2: STUDY PAGE -->
        <div id="study-page" class="page">
            <h2>Interactive Sentence</h2>
            <div id="display-box"></div>
            <div class="hint">Tap any word to cycle: White (Character) → Green (Pinyin) → Yellow (Translation)</div>
        </div>
    </div>

    <script>
        function showInputPage() {
            document.getElementById('study-page').classList.remove('active');
            document.getElementById('input-page').classList.add('active');
            document.getElementById('nav-bar').style.display = 'none';
        }

        function parseAndLoadStudy() {
            const rawText = document.getElementById('ai-input').value.trim();
            if (!rawText) {
                alert("Please paste the AI output data first!");
                return;
            }

            const lines = rawText.split('\n').filter(l => l.trim() !== "");
            const displayBox = document.getElementById('display-box');
            displayBox.innerHTML = ""; // Clear out previous tokens

            let validLinesCount = 0;

            lines.forEach(line => {
                // Split lines using the pipe '|' character assigned by the chatbot
                const parts = line.split('|').map(p => p.trim());
                
                // Ensure the line has all three components: Chinese, Pinyin, English
                if (parts.length >= 3) {
                    validLinesCount++;
                    const chinese = parts[0];
                    const pinyin = parts[1];
                    const english = parts[2];

                    // Create dynamic text container element
                    const token = document.createElement('span');
                    token.className = 'word-token state-chinese';
                    token.textContent = chinese;

                    // State tracker: 0 = Chinese, 1 = Pinyin, 2 = English
                    let currentState = 0;

                    token.onclick = () => {
                        currentState = (currentState + 1) % 3;
                        
                        // Clear out previous phase visual tracking classes
                        token.className = 'word-token';

                        if (currentState === 0) {
                            token.textContent = chinese;
                            token.classList.add('state-chinese');
                        } else if (currentState === 1) {
                            token.textContent = pinyin;
                            token.classList.add('state-pinyin');
                        } else if (currentState === 2) {
                            token.textContent = english;
                            token.classList.add('state-english');
                        }
                    };

                    displayBox.appendChild(token);
                    // Insert a space element between characters so sentence reading fragments stack naturally
                    displayBox.appendChild(document.createTextNode(" "));
                }
            });

            if (validLinesCount === 0) {
                alert("Error: The text format didn't match. Make sure the lines contain the '|' separator character!");
                return;
            }

            // Switch UI views cleanly
            document.getElementById('input-page').classList.remove('active');
            document.getElementById('study-page').classList.add('active');
            document.getElementById('nav-bar').style.display = 'block';
        }
    </script>
</body>
</html>
