<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chinese Study Tool</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; padding: 20px; }
        #input-area { width: 100%; height: 120px; background: #1e1e1e; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; }
        .word-block { display: inline-block; padding: 5px; margin: 2px; border: 1px solid #333; cursor: pointer; border-radius: 4px; background: #252525; min-width: 40px; text-align: center; }
        #display { margin-top: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>
    <h2>Paste your 3 lines:</h2>
    <textarea id="input-area" placeholder="Paste Chinese, Pinyin, and English lines here..."></textarea>
    <button onclick="processText()" style="margin-top:10px; padding:10px;">Build Study Set</button>
    <div id="display"></div>

    <script>
        function processText() {
            const lines = document.getElementById('input-area').value.split('\n').filter(l => l.trim() !== "");
            if (lines.length < 3) { alert("Please paste at least 3 lines!"); return; }
            
            const chinese = lines[0].split(/\s+/);
            const pinyin = lines[1].split(/\s+/);
            const meaning = lines[2].split(/\s+/);
            
            const display = document.getElementById('display');
            display.innerHTML = "";
            
            for (let i = 0; i < chinese.length; i++) {
                const block = document.createElement('div');
                block.className = 'word-block';
                block.dataset.state = 0;
                block.textContent = chinese[i];
                
                block.onclick = () => {
                    block.dataset.state = (parseInt(block.dataset.state) + 1) % 3;
                    const s = block.dataset.state;
                    block.textContent = (s == 0) ? chinese[i] : (s == 1) ? (pinyin[i] || "---") : (meaning[i] || "---");
                };
                display.appendChild(block);
            }
        }
    </script>
</body>
</html>
